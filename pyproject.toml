[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lamix"
version = "0.2.0"
description = "一起认识这个世界的AI伙计"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0",
    "prompt_toolkit>=3.0.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "jieba>=0.42.1",
    "APScheduler>=3.10.0",
    "certifi>=2023.7.22",
    "rich>=13.0.0",
    "setproctitle>=1.3.7",
]

[project.optional-dependencies]
feishu = ["lark-oapi>=1.5.0"]
desktop = ["pyautogui>=0.9.54", "Pillow>=10.0.0"]
all = [
    "lark-oapi>=1.5.0",
    "pyautogui>=0.9.54",
    "Pillow>=10.0.0",
]

[project.scripts]
lamix = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
